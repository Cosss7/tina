<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tina</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #d8d8dd;
        --muted: #6b6b76;
        --bg: #ffffff;
        --panel: #fafafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --line: #34343c;
          --muted: #9a9aa6;
          --bg: #16161a;
          --panel: #1d1d23;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 32px 64px;
        background: var(--bg);
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; }
      .status { font-size: 13px; color: var(--muted); }
      .status.online { color: #1a7f37; }
      .status.offline { color: #b42318; }
      .board { margin-bottom: 32px; }
      .board h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      .board .meta { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
      .columns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .column {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px 16px;
        min-height: 120px;
      }
      .column h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .empty { font-size: 12px; color: var(--muted); }
      .empty-state { padding: 48px 0; text-align: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Tina</h1>
      <div class="status" id="status">连接中…</div>
    </header>
    <main id="boards"><p class="empty-state">等节点上报项目…</p></main>
    <script>
      const COLUMNS = [
        { key: 'todo', label: '待办' },
        { key: 'doing', label: '进行中' },
        { key: 'review', label: '评审中' },
        { key: 'done', label: '已完成' },
      ];

      function nodeSummary(state) {
        const nodes = state.nodes ?? [];
        if (nodes.length === 0) return { text: '节点未连接', className: 'status offline' };
        const online = nodes.filter((node) => node.online);
        if (online.length === 0) return { text: '节点离线', className: 'status offline' };
        return {
          text: online.map((node) => node.name + ' 在线 · ' + node.version).join(' / '),
          className: 'status online',
        };
      }

      function boardHtml(project) {
        const columns = COLUMNS.map(
          (column) =>
            '<div class="column"><h3>' +
            column.label +
            '</h3><p class="empty">还没有卡片</p></div>',
        ).join('');
        return (
          '<section class="board"><h2>' +
          project.name +
          '</h2><p class="meta">' +
          project.id +
          ' · ' +
          (project.online ? '节点在线' : '节点离线') +
          '</p><div class="columns">' +
          columns +
          '</div></section>'
        );
      }

      function render(state) {
        const summary = nodeSummary(state);
        const status = document.getElementById('status');
        status.textContent = summary.text;
        status.className = summary.className;

        const boards = document.getElementById('boards');
        const projects = state.projects ?? [];
        if (projects.length === 0) {
          boards.innerHTML = '<p class="empty-state">等节点上报项目…</p>';
          return;
        }
        boards.innerHTML = projects.map(boardHtml).join('');
      }

      async function refresh() {
        try {
          const response = await fetch('/api/state', { cache: 'no-store' });
          if (!response.ok) throw new Error(String(response.status));
          render(await response.json());
        } catch {
          const status = document.getElementById('status');
          status.textContent = '控制面不可达';
          status.className = 'status offline';
        }
      }

      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
