name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            services/control-plane/go.sum
            services/tinad/go.sum

      - run: pnpm install --frozen-lockfile

      - name: Download Go dependencies
        run: |
          go -C services/control-plane mod download
          go -C services/tinad mod download

      # 安装后离线验证；真实模型验收必须显式开启，不进入 CI。
      - run: make verify
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local

      - name: Go race checks
        run: |
          go -C services/control-plane test -race ./...
          go -C services/tinad test -race ./...
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
